<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap">
<style>
:root{
  /* === Flächen — warmes Papier (Editorial) === */
  --bg:#e8e3d7;               /* Seite, etwas tiefer als Karte */
  --surface:#f1eee6;          /* Karten = Papier */
  --surface-dark:#2c2c2a;     /* invertierte Akzentfläche (Hero/Sticky) */
  --surface-ink:#2c2c2a;      /* Alias, semantisch */
  --surface-alt:#e6e1d4;      /* Sekundärflächen (Tabs, Chips) */
  --border:rgba(44,44,42,.14);
  --border-strong:rgba(44,44,42,.30);

  /* === Text === */
  --text:#2c2c2a;
  --text-muted:#5f5e5a;
  --text-faint:#8a8881;

  /* === Akzent — warm/editorial (Terrakotta) === */
  --accent:#b8502f;                                            /* Primary (warm) */
  --accent-light:#efe2d6;                                      /* Soft Tint */
  --accent-text:#9a3f23;                                       /* Text auf accent-light */
  --accent-end:#d9803f;                                        /* Gradient-Endpunkt */
  --accent-gradient:linear-gradient(135deg,#b8502f,#d9803f);   /* Signal-Gradient (warm) */
  --orange:#c8603a;                                            /* Datenfarbe (Terrakotta) */
  --orange-soft:#d79b46;                                       /* Datenfarbe (Ocker) */

  /* === Daten-Palette (gedämpft, editorial) === */
  --data-ochre:#d79b46;
  --data-slate:#7c9bb5;
  --data-olive:#6f8f3e;
  --data-plum:#8c6db0;
  --data-terracotta:#c8603a;

  /* === ACWR-Status === */
  --acwr-low:#85a7c4;
  --acwr-optimal:#6f8f3e;
  --acwr-caution:#d99a2b;
  --acwr-high:#c0453f;

  /* === Radius === */
  --radius:10px;
  --radius-lg:14px;

  /* === Typografie === */
  --font-serif:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif;
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"SF Mono","Roboto Mono",Consolas,monospace;

  /* Typo-Skala */
  --t-cap:.7rem; --t-sm:.78rem; --t-base:.86rem; --t-md:.95rem; --t-lg:1.1rem; --t-xl:1.4rem;

  --nav-h:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));}
.wrap{max-width:980px;margin:0 auto;padding:1.25rem 1rem 2rem;}
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2.5rem 2rem;text-align:center;max-width:360px;width:100%;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(44,44,42,.10);}
.auth-box::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--accent-gradient);}
.auth-box h1{font-size:1.4rem;font-weight:600;margin:0 0 .5rem;}
.auth-box p{font-size:.88rem;color:var(--text-muted);margin:0 0 1.75rem;}
.btn-github{display:inline-flex;align-items:center;gap:.6rem;background:#24292e;color:#fff;border:none;border-radius:var(--radius);padding:.65rem 1.4rem;font-size:.95rem;font-weight:500;cursor:pointer;font-family:var(--font-sans);}
.btn-github:hover{background:#1a1e22;}
#bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--border);display:flex;height:var(--nav-h);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -1px 8px rgba(44,44,42,.06);}
#bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;cursor:pointer;font-size:.6rem;color:var(--text-muted);padding:.25rem 0;font-family:var(--font-sans);position:relative;}
#bottom-nav button.active{color:var(--accent);font-weight:600;}
#bottom-nav button.active::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--accent-gradient);border-radius:0 0 2px 2px;}
#bottom-nav button .nav-icon{font-size:1.2rem;line-height:1;}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:.75rem;}
header h1{font-size:1.4rem;font-weight:600;margin:0;letter-spacing:-.01em;}
.header-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;}
.user-chip{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--text-muted);}
.user-chip img{width:26px;height:26px;border-radius:50%;object-fit:cover;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#16a34a;flex-shrink:0;transition:background .3s;box-shadow:0 0 0 3px rgba(22,163,74,.12);}
.sync-dot.syncing{background:#e85d2f;box-shadow:0 0 0 3px rgba(232,93,47,.15);animation:pulse 1s infinite;}
.sync-dot.error{background:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,.12);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.page{display:none;}.page.active{display:block;}
/* Editorial: Überschriften in Serif, Body/UI bleibt Sans */
h1,h2,h3{font-family:var(--font-sans);font-weight:600;letter-spacing:-.01em;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.1rem 1.25rem;margin-bottom:1.25rem;}
.card h2{font-size:.92rem;font-weight:600;margin:0 0 .9rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
.badge{font-size:.68rem;font-weight:500;font-family:var(--font-mono);color:var(--text-muted);background:var(--bg);border:1px solid var(--border);border-radius:100px;padding:.12rem .5rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.75rem;}
.grid>.field{min-width:0;}
input[type="date"]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;}
.field{display:flex;flex-direction:column;gap:.3rem;min-width:0;}
label{font-size:.76rem;color:var(--text-muted);font-weight:500;}
input,select,textarea{border:1px solid var(--border-strong);border-radius:var(--radius);padding:.48rem .6rem;background:var(--surface);color:var(--text);width:100%;font-family:var(--font-sans);font-size:.9rem;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
textarea{resize:vertical;min-height:3rem;}
textarea.note-expanded{min-height:9rem;}
.note-history-box{margin-top:.55rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);max-height:13rem;overflow-y:auto;}
.note-history-box .nh-head{font-size:.68rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;padding:.5rem .7rem .25rem;}
.note-history-box .nh-item{border-top:1px solid var(--border);}
.note-history-box .nh-item summary{padding:.45rem .7rem;cursor:pointer;list-style:none;display:flex;align-items:center;gap:.5rem;}
.note-history-box .nh-item summary::-webkit-details-marker{display:none;}
.note-history-box .nh-item summary::marker{content:'';}
.note-history-box .nh-item summary:hover{background:var(--surface);}
.note-history-box .nh-date{font-size:.68rem;font-family:var(--font-mono);color:var(--accent-text);font-weight:600;flex-shrink:0;}
.note-history-box .nh-name{font-size:.78rem;color:var(--text);font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1;}
.note-history-box .nh-chevron{font-size:.62rem;color:var(--text-faint);transition:transform .15s;flex-shrink:0;}
.note-history-box .nh-item[open] .nh-chevron{transform:rotate(90deg);}
.note-history-box .nh-item[open] summary{background:var(--surface);border-bottom:1px solid var(--border);}
.note-history-box .nh-text{padding:.5rem .7rem;font-size:.78rem;color:var(--text);white-space:pre-wrap;line-height:1.45;}
.note-history-box .nh-empty{padding:.6rem .7rem;font-size:.78rem;color:var(--text-faint);}
.row{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap;}
.row-end{margin-left:auto;}
button{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);padding:.48rem .9rem;cursor:pointer;color:var(--text);font-weight:500;font-family:var(--font-sans);font-size:.88rem;transition:background .12s;}
button:hover{background:var(--bg);}button:active{transform:scale(.97);}
button.primary{background:var(--accent-gradient);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 1px 3px rgba(184,80,47,.25);}
button.primary:hover{filter:brightness(1.05);box-shadow:0 2px 8px rgba(184,80,47,.35);}
button.primary:active{filter:brightness(.95);}
button.danger{background:#fef2f2;border-color:#fca5a5;color:#c4544a;}
button.icon{padding:.32rem .45rem;line-height:1;}
button.ghost{background:transparent;border-color:transparent;color:var(--text-muted);font-size:.82rem;}
button.ghost:hover{color:var(--text);background:var(--bg);border-color:var(--border);}
.status{font-size:.8rem;color:var(--text-muted);}
.week-nav{display:flex;align-items:center;justify-content:center;gap:.85rem;margin-bottom:1.1rem;}
.week-nav .label{font-family:var(--font-mono);font-size:.85rem;font-weight:500;min-width:200px;text-align:center;}
.current-tag{font-size:.68rem;color:var(--accent-text);background:var(--accent-light);border-radius:100px;padding:.08rem .45rem;margin-left:.35rem;}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:.75rem;margin-bottom:1.25rem;}
.metrics-3{grid-template-columns:repeat(3,1fr);}
.acwr-group-label{font-size:.7rem;font-weight:600;color:var(--text-muted);margin:0 0 .4rem;}
.acwr-group-label:not(:first-child){margin-top:.2rem;}
.weekly-detail-box{margin-top:.9rem;padding-top:.8rem;border-top:1px solid var(--border);animation:wdFadeIn .2s ease;}
@keyframes wdFadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
.weekly-detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;}
.weekly-detail-head span{font-size:.82rem;font-weight:600;color:var(--text);}
.weekly-detail-close{background:var(--bg);border:1px solid var(--border);border-radius:50%;width:24px;height:24px;font-size:.7rem;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.weekly-detail-close:hover{background:var(--surface);color:var(--text);}
.link-cand-single{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:.6rem .7rem;display:flex;flex-direction:column;gap:.2rem;}
.link-cand-single strong{font-size:.85rem;color:var(--text);}
.link-cand-single span{font-size:.74rem;color:var(--text-muted);}
.modal-edit-form{border-top:1px solid var(--border);margin-top:.6rem;padding-top:.6rem;display:flex;flex-direction:column;gap:.5rem;animation:wdFadeIn .15s ease;}
.modal-edit-row{display:flex;flex-direction:column;gap:.2rem;}
.modal-edit-row label{font-size:.7rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;}
.modal-edit-row input,.modal-edit-row textarea{padding:.45rem .55rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:.85rem;font-family:inherit;width:100%;}
.modal-edit-row textarea{resize:vertical;min-height:60px;line-height:1.4;}
.modal-profile{margin-top:.6rem;padding-top:.5rem;border-top:1px solid var(--border);}
.modal-profile-label{font-size:.7rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.35rem;}
.modal-profile-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg);}
.modal-profile-bar>div{height:100%;}
.modal-profile-legend{display:flex;flex-wrap:wrap;gap:.5rem;font-size:.7rem;margin-top:.35rem;}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.8rem 1rem;position:relative;overflow:hidden;}
.metric::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent-gradient);opacity:0;transition:opacity .2s;}
.metric:hover::before{opacity:1;}
.metric .m-label{font-size:.72rem;color:var(--text-muted);margin:0 0 .25rem;}
.metric .m-value{font-size:1.3rem;font-weight:600;font-family:var(--font-mono);letter-spacing:-.02em;color:var(--text);}
.charts{display:grid;grid-template-columns:1.4fr 1fr;gap:1.25rem;margin-bottom:1.25rem;}
@media(max-width:600px){.charts{grid-template-columns:1fr;}}
.chart-box{position:relative;height:180px;}
.workload-chart-box{position:relative;height:220px;}
/* Einheitliche Papier-Panels für alle Visualisierungen (SVG via .wlc-paper, Canvas via .chart-dark) */
.wlc-paper,.chart-dark{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;position:relative;overflow:hidden;}
.wlc-paper svg{width:100%;height:100%;display:block;}
.chart-dark canvas{position:relative;z-index:1;}
.legend{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:.5rem;font-size:.75rem;color:var(--text-muted);}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:-1px;}
.entry{border-bottom:1px solid var(--border);padding:.7rem 0;}
.entry:last-child{border-bottom:none;}
.entry-top{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;cursor:pointer;user-select:none;}
.entry-sport{font-weight:600;display:flex;align-items:center;gap:.35rem;min-width:80px;}
.entry-date{font-family:var(--font-mono);font-size:.78rem;color:var(--text-muted);min-width:65px;}
/* Rollen: .badge = neutrales Mono-Label (Meta/Status) · .pill = semantisch eingefärbtes Label (Zone/Sportart) */
.pill{font-size:.68rem;font-weight:500;padding:.1rem .5rem;border-radius:100px;display:inline-block;}
.entry-duration{font-family:var(--font-mono);font-size:.82rem;color:var(--text-muted);}
.entry-meta{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.28rem;}
.entry-meta span{font-size:.75rem;color:var(--text-muted);}
.entry-detail{display:none;margin-top:.65rem;background:var(--bg);border-radius:var(--radius);padding:.85rem;border:1px solid var(--border);}
.entry-detail.open{display:block;}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.6rem;margin-bottom:.75rem;}
.detail-field{display:flex;flex-direction:column;gap:.22rem;}
.detail-field label{font-size:.7rem;}
.empty{color:var(--text-faint);font-size:.85rem;text-align:center;padding:1.5rem 0;}
.upload-zone{border:2px dashed var(--border-strong);border-radius:var(--radius-lg);padding:1.25rem;text-align:center;transition:border-color .2s,background .2s;margin-bottom:.5rem;}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:var(--accent-light);}
.upload-zone .icon{font-size:1.75rem;margin-bottom:.4rem;}
.upload-zone p{margin:0;font-size:.84rem;color:var(--text-muted);}
.file-btn{display:inline-flex;align-items:center;gap:.4rem;background:var(--accent-gradient);color:#fff;font-weight:600;font-size:.86rem;padding:.55rem 1rem;border-radius:var(--radius);cursor:pointer;box-shadow:0 1px 3px rgba(184,80,47,.25);transition:filter .12s;}
.file-btn:hover{filter:brightness(1.05);}
.file-btn:active{filter:brightness(.95);}
#t-gpx{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;}
.gpx-preview-box{background:var(--accent-light);border:1px solid var(--accent);border-radius:var(--radius);padding:.85rem 1rem;margin-bottom:.85rem;}
.gpx-preview-box h3{font-size:.84rem;font-weight:600;margin:0 0 .6rem;color:var(--accent-text);}
.gpx-stats{display:flex;flex-wrap:wrap;gap:.75rem;}
.gpx-stat{font-size:.78rem;color:var(--text-muted);}
.gpx-stat strong{display:block;font-size:.95rem;font-weight:600;color:var(--text);font-family:var(--font-mono);}
.import-hint{font-size:.78rem;color:var(--text-muted);margin:0 0 .75rem;}
code{font-family:var(--font-mono);font-size:.82em;background:var(--bg);padding:.08rem .28rem;border-radius:4px;}
.cal-tabs{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:100px;padding:.18rem;}
.cal-tabs button{border:none;background:transparent;border-radius:100px;padding:.3rem .85rem;font-size:.82rem;color:var(--text-muted);}
.cal-tabs button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:600;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem;}
.cal-weekday{font-size:.65rem;font-weight:600;color:var(--text-muted);text-align:center;padding-bottom:.2rem;text-transform:uppercase;letter-spacing:.04em;}
.cal-cell{border:1px solid var(--border);border-radius:8px;background:var(--surface);min-height:76px;padding:.3rem;display:flex;flex-direction:column;gap:.2rem;}
.cal-cell.outside{background:var(--bg);opacity:.4;}
.cal-cell.today{border-color:var(--accent);box-shadow:inset 0 2px 0 0 var(--accent);}
.cal-daynum{font-family:var(--font-mono);font-size:.68rem;color:var(--text-muted);}
.cal-cell.today .cal-daynum{color:var(--accent-text);font-weight:700;}
.cal-entries{display:flex;flex-direction:column;gap:.18rem;flex:1;}
.cal-chip{display:flex;align-items:center;gap:.25rem;font-size:.62rem;font-weight:600;border-radius:5px;padding:.08rem .28rem;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;position:relative;}
.cal-chip-warn{width:6px;height:6px;border-radius:50%;background:#d97706;flex-shrink:0;box-shadow:0 0 0 1.5px var(--surface);}
.cal-chip .cal-dur{margin-left:auto;font-family:var(--font-mono);font-weight:500;opacity:.75;flex-shrink:0;}
.cal-grid.week .cal-cell{min-height:130px;}
.cal-grid.week .cal-chip{font-size:.7rem;padding:.2rem .32rem;white-space:normal;}
.cal-legend{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:.85rem;font-size:.75rem;color:var(--text-muted);}
@media(max-width:600px){
  .cal-grid{gap:.15rem;}
  .cal-cell{padding:.15rem;min-height:48px;overflow:hidden;}
  .cal-grid.week .cal-cell{min-height:90px;}
  .cal-weekday{font-size:.56rem;}
  .cal-daynum{font-size:.6rem;}
  /* Monatsansicht: Chips auf reines Icon reduzieren, damit alle 7 Spalten passen */
  .cal-grid:not(.week) .cal-chip{
    justify-content:center;
    padding:.1rem;
    background:transparent!important;
    gap:0;
    max-width:100%;
  }
  .cal-grid:not(.week) .cal-chip-label{display:none;}
  .cal-grid:not(.week) .cal-dur{display:none;}
  .cal-grid:not(.week) .cal-chip-icon{font-size:.78rem;}
  .cal-grid:not(.week) .cal-entries{flex-direction:row;flex-wrap:wrap;gap:.08rem;justify-content:center;align-items:center;}
  /* Kalender-Card auf Mobile schlanker, damit 7 Spalten ohne Scroll passen */
  #page-calendar .card{padding:.85rem .6rem;}
  #page-calendar .cal-tabs button{padding:.3rem .65rem;font-size:.78rem;}
  #cal-label{min-width:auto!important;font-size:.78rem!important;}
}
/* Segment-Tabs (Auswertung & Wochen-Umschalter) — einheitliches Aussehen */
.analytics-tabs,.tab-bar{display:flex;gap:.5rem;margin-bottom:1.1rem;flex-wrap:wrap;}
.analytics-tabs button,.tab-bar button{font-size:.8rem;padding:.32rem .75rem;}
.analytics-tabs button.active,.tab-bar button.active{background:var(--accent-gradient);border-color:transparent;color:#fff;font-weight:600;}
.sport-filter{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.85rem;}
.sport-filter button{font-size:.75rem;padding:.25rem .6rem;border-radius:100px;}
.sport-filter button.active{color:#fff;border-color:transparent;}
.analytics-chart-box{position:relative;height:220px;margin-bottom:1.1rem;}
.analytics-table{width:100%;border-collapse:collapse;font-size:.82rem;}
.analytics-table th{font-size:.72rem;color:var(--text-muted);font-weight:600;text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--border);}
.analytics-table td{padding:.4rem .5rem;border-bottom:1px solid var(--border);}
.analytics-table tr:last-child td{border-bottom:none;}

/* ── KI-CHAT ── */
.ai-analysis-box{background:var(--accent-light);border:1px solid var(--accent);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:1.25rem;font-size:.88rem;line-height:1.7;white-space:pre-wrap;}
.ai-analysis-box h3{font-size:.85rem;font-weight:600;color:var(--accent-text);margin:0 0 .5rem;}
.chat-messages{display:flex;flex-direction:column;gap:.75rem;margin-bottom:1rem;max-height:400px;overflow-y:auto;padding:.25rem 0;}
.chat-msg{display:flex;gap:.6rem;align-items:flex-start;}
.chat-msg.user{flex-direction:row-reverse;}
.chat-bubble{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.6rem .85rem;font-size:.86rem;line-height:1.6;max-width:85%;white-space:pre-wrap;}
.chat-msg.user .chat-bubble{background:var(--accent-gradient);border-color:transparent;color:#fff;}
.chat-msg.ai .chat-bubble{background:var(--surface);}
.chat-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;background:var(--accent-light);}
.chat-msg.user .chat-avatar{background:#24292e;color:#fff;font-size:.7rem;}
.chat-input-row{display:flex;gap:.5rem;}
.chat-input-row textarea{min-height:2.5rem;max-height:6rem;flex:1;}
.ai-loading{display:flex;gap:4px;align-items:center;padding:.5rem 0;}
.ai-loading span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bounce .8s infinite;}
.ai-loading span:nth-child(2){animation-delay:.15s;}
.ai-loading span:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

/* ── SETTINGS ── */
.sport-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.55rem;flex-wrap:wrap;}
.sport-row .sport-name{font-weight:500;min-width:80px;font-size:.88rem;}
.color-pick{width:34px;height:34px;padding:2px;border:1px solid var(--border-strong);border-radius:8px;cursor:pointer;}
.emoji-pick{width:52px;text-align:center;font-size:1rem;padding:.3rem;}
.sport-img-preview{width:34px;height:34px;border-radius:6px;object-fit:cover;border:1px solid var(--border);}
.zone-row{display:grid;grid-template-columns:1fr 72px 72px 34px;gap:.4rem;align-items:center;margin-bottom:.45rem;}
.zone-row input{font-size:.82rem;}
.zone-color-pick{width:30px;height:30px;padding:2px;border:1px solid var(--border-strong);border-radius:6px;cursor:pointer;}

/* ── PROFIL ── */
.profile-textarea{min-height:220px;font-family:var(--font-mono);font-size:.82rem;line-height:1.6;}
.profile-hint{font-size:.78rem;color:var(--text-muted);margin:0 0 .75rem;line-height:1.6;}

/* ── MULTI-GPX ── */
.gpx-multi-list{display:flex;flex-direction:column;gap:.4rem;margin-top:.6rem;}
.gpx-multi-item{display:flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.5rem .65rem;font-size:.8rem;flex-wrap:wrap;}
.gpx-multi-item select{width:auto;font-size:.78rem;padding:.22rem .4rem;flex-shrink:0;}
.gpx-multi-item .mi-name{font-weight:500;flex:1;min-width:120px;}
.gpx-multi-item .mi-meta{color:var(--text-muted);font-family:var(--font-mono);font-size:.72rem;}
.gpx-multi-remove{margin-left:auto;cursor:pointer;color:var(--text-muted);background:transparent;border:none;padding:.15rem .35rem;font-size:.95rem;}
.gpx-multi-remove:hover{color:#c4544a;}

/* ── MODAL ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:2rem 1rem;overflow-y:auto;}
.modal-backdrop.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);max-width:480px;width:100%;padding:1.25rem;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.modal h2{font-size:1rem;font-weight:600;margin:0 0 .85rem;display:flex;align-items:center;gap:.5rem;}
.modal-close{margin-left:auto;background:transparent;border:none;font-size:1.05rem;cursor:pointer;color:var(--text-muted);padding:.1rem .3rem;}
.modal-row{display:flex;justify-content:space-between;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--border);font-size:.85rem;gap:.5rem;}
.modal-row:last-of-type{border-bottom:none;}
.modal-row .ml{color:var(--text-muted);font-size:.78rem;}
.modal-row .mv{font-weight:500;text-align:right;}
.modal-row .mv .pill{font-family:var(--font-sans);}
.modal-note{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:.6rem .75rem;margin-top:.75rem;font-size:.85rem;line-height:1.5;white-space:pre-wrap;}
.modal-actions{display:flex;gap:.5rem;margin-top:1rem;justify-content:flex-end;flex-wrap:wrap;}
/* Tabler Icons: konsistente Größe in verschiedenen Kontexten */
h2 .ti, h3 .ti{font-size:1.05em;vertical-align:-.1em;margin-right:.25rem;}
button .ti, label .ti{font-size:.95em;vertical-align:-.1em;}
.pill .ti{font-size:.85em;vertical-align:-.05em;margin-right:.2rem;}
.workload-row .ti, .modal-row .ti{font-size:.9em;vertical-align:-.1em;}
.gpx-preview-box h3 .ti{font-size:1em;vertical-align:-.1em;margin-right:.3rem;}
.cal-chip{cursor:pointer;}

/* Bibliothek: Vorlagen-Karten und Filter-Pills */
.lib-filter-pill{padding:.3rem .6rem;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text-muted);font-size:.72rem;cursor:pointer;white-space:nowrap;transition:all .12s;}
.lib-filter-pill:hover{border-color:var(--accent);color:var(--text);}
.lib-filter-pill.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.lib-template-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.7rem .8rem;margin-bottom:.5rem;cursor:pointer;transition:all .12s;}
.lib-template-card:hover{border-color:var(--accent);background:var(--surface-alt);}
.lib-template-title{font-weight:600;font-size:.88rem;color:var(--text);margin-bottom:.25rem;}
.lib-template-meta{display:flex;flex-wrap:wrap;gap:.4rem;font-size:.68rem;color:var(--text-muted);align-items:center;}
.lib-template-tag{padding:.12rem .45rem;border-radius:4px;background:var(--surface-alt);}
.lib-template-tag.goal{background:var(--accent-light);color:var(--accent-text);font-weight:600;}
.lib-template-preview{font-size:.72rem;color:var(--text-muted);margin-top:.35rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
/* Feedback: Anmerkung + KI-Hinweis im Session-Modal */
.feedback-section{margin-top:.75rem;border-top:1px solid var(--border);padding-top:.7rem;}
.feedback-hint-box{margin-top:.5rem;padding:.55rem .65rem;background:rgba(140,109,176,.08);border:1px solid rgba(140,109,176,.22);border-left:3px solid var(--data-plum);border-radius:var(--radius);font-size:.78rem;line-height:1.5;color:var(--text);}
.feedback-hint-box::before{content:"\e7f6  ";font-family:"tabler-icons";color:var(--data-plum);font-size:.85em;}
/* Feedback-Vorschau in Log-Liste */
.entry-feedback{font-size:.72rem;color:var(--text-muted);font-style:italic;margin:.15rem 0 0 0;padding-left:.1rem;}
.entry-feedback-hint{font-size:.7rem;color:var(--data-plum);margin:.1rem 0 0;}
.cal-cell-empty{cursor:pointer;transition:background .15s;}
.cal-cell-empty:hover{background:var(--surface);}
.cal-add-btn{position:absolute;bottom:.2rem;right:.25rem;width:18px;height:18px;border-radius:50%;background:var(--border);color:var(--text-muted);font-size:.9rem;line-height:18px;text-align:center;cursor:pointer;opacity:0;transition:opacity .15s;display:flex;align-items:center;justify-content:center;}
.cal-cell-empty:hover .cal-add-btn{opacity:1;}
.cal-cell{position:relative;}

/* ── WORKLOAD / sRPE ── */
.srpe-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:200;padding:0 0 env(safe-area-inset-bottom);}
.srpe-modal-backdrop.open{display:flex;}
.srpe-modal{background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:1.5rem 1.25rem 2rem;width:100%;max-width:520px;}
.srpe-modal h3{font-size:.95rem;font-weight:600;margin:0 0 .3rem;}
.srpe-modal .srpe-subtitle{font-size:.8rem;color:var(--text-muted);margin:0 0 1.1rem;}
.srpe-scale{display:flex;gap:.3rem;margin-bottom:.5rem;}
.srpe-scale button{flex:1;padding:.55rem 0;font-size:.82rem;font-weight:600;border-radius:6px;border:2px solid var(--border);background:var(--bg);color:var(--text-muted);cursor:pointer;transition:all .12s;}
.srpe-scale button.selected{border-color:var(--accent);background:var(--accent-light);color:var(--accent-text);}
.srpe-labels{display:flex;justify-content:space-between;font-size:.68rem;color:var(--text-faint);margin-bottom:1.1rem;}
.srpe-actions{display:flex;gap:.6rem;justify-content:flex-end;}
.workload-section{margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--border);}
.workload-section h4{font-size:.75rem;font-weight:600;color:var(--text-muted);letter-spacing:.04em;text-transform:uppercase;margin:0 0 .5rem;}
.workload-row{display:flex;justify-content:space-between;font-size:.83rem;padding:.22rem 0;}
.workload-value{font-weight:600;font-family:var(--font-mono);}
.workload-badge{display:inline-flex;align-items:center;gap:.3rem;background:var(--accent-light);color:var(--accent-text);border-radius:100px;padding:.18rem .6rem;font-size:.75rem;font-weight:600;}

.wl-total-label{color:var(--text-muted);}
.wl-total-value{font-weight:600;font-family:var(--font-mono);}
/* Einstellungen HRmax/HRrest */
.hr-param-row{display:flex;gap:.75rem;margin-bottom:.75rem;align-items:flex-end;}
.hr-param-row .field{flex:1;}

.sport-row .sport-label-inline{flex:1;min-width:100px;font-size:.85rem;}
.sport-row .sport-freitext-inline{width:auto;cursor:pointer;}
.sport-row .freitext-lbl{display:flex;align-items:center;gap:.25rem;font-size:.7rem;color:var(--text-muted);cursor:pointer;white-space:nowrap;}
.sport-row .sport-delete-inline{padding:.28rem .45rem;background:#fef2f2;border-color:#fca5a5;color:#c4544a;}
.add-sport-btn{margin-top:.6rem;font-size:.82rem;}
/* ── Anatomie-Collage (Zonenverteilung Log-Seite) ───────────────────────── */
/* Bild ist NUR hinter den Balken sichtbar (via CSS-Mask). Der restliche
   Block-Hintergrund bleibt papierfarben neutral. */
.zone-collage{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.1rem 1.25rem;margin:1rem 0;}
/* Gemeinsamer Wochen-Rahmen (Log-Seite) */
.week-summary{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.1rem 1.25rem 1.3rem;margin:1rem 0;}
.ws-nav{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:1rem;padding-bottom:.7rem;border-bottom:0.5px solid var(--border);}
.ws-title{font-weight:500;font-size:1rem;color:var(--text);text-align:center;flex:1;}
.ws-nav .icon{background:rgba(44,44,42,.06);border:none;color:var(--text);width:34px;height:34px;border-radius:8px;font-size:1.1rem;cursor:pointer;flex-shrink:0;}
.ws-nav .icon:hover{background:rgba(44,44,42,.12);}
.ws-section{margin-top:1.4rem;}
.ws-section:first-of-type{margin-top:1rem;}
.ws-h{font-size:.95rem;font-weight:600;color:var(--text);margin:0 0 .7rem;}
.week-summary .metric{background:rgba(255,255,255,.45);}
.week-summary .m-label{color:var(--text-muted);}
.week-summary .m-value{color:var(--text);}
/* Wochen-Workload Tagesbalken */
.wd-col{display:flex;flex-direction:column;align-items:stretch;}
.wd-val-row{height:22px;display:flex;align-items:center;justify-content:center;}
.wd-val{font-size:.74rem;font-weight:600;color:var(--text);white-space:nowrap;}
.wd-plan-val{color:var(--text-faint);font-weight:400;}
.wd-bar-area{position:relative;flex:1;overflow:hidden;}
.wd-bar-img{position:absolute;left:15%;width:70%;object-fit:cover;object-position:center;filter:grayscale(0.85) contrast(1.1);border-radius:3px 3px 0 0;}
.wd-bar-img.wd-plan{opacity:.32;filter:grayscale(1) contrast(.9);}
.wd-bar-tint{position:absolute;left:15%;width:70%;border-radius:3px 3px 0 0;pointer-events:none;}
.wd-bar-frame{position:absolute;left:15%;width:70%;border:1.5px solid;border-radius:3px 3px 0 0;pointer-events:none;}
.wd-plan-edge{border-style:dashed;opacity:.55;}
.wd-label{text-align:center;font-size:.72rem;color:var(--text-muted);padding-top:.35rem;}
.wd-today{color:var(--text);font-weight:600;}
/* Aufklappbare Karten */
.collapsible-card{padding:0;}
.collapse-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;padding:.85rem 1.1rem;background:none;border:none;text-align:left;font-size:.93rem;font-weight:500;color:var(--text);cursor:pointer;gap:.5rem;}
.collapse-toggle:hover{background:rgba(255,255,255,.03);}
.collapse-toggle span{display:flex;align-items:center;gap:.45rem;}
.collapse-chevron{font-size:.95rem;color:var(--text-muted);transition:transform .22s ease;flex-shrink:0;}
.collapse-chevron.open{transform:rotate(180deg);}
.card-body{padding:0 1.1rem 1rem;}
.zc-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.85rem;padding-bottom:.5rem;border-bottom:0.5px solid var(--border);}
.zc-h h2{font-weight:600;font-size:1.05rem;letter-spacing:-.01em;margin:0;color:var(--text);}
.zc-week{font-style:italic;font-size:.78rem;color:var(--text-muted);}
.zc-g{display:grid;grid-template-columns:2fr 2fr 1fr;gap:10px;}
.ab{position:relative;height:240px;border:1px solid var(--border);border-radius:4px;overflow:hidden;background:var(--surface);}
.ab-svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
.ab-anatomy-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:grayscale(1) contrast(1.1) brightness(.88);}
.ab-anatomy-tint{position:absolute;inset:0;pointer-events:none;}
.zb-val{position:absolute;transform:translateX(-50%);font-family:var(--font-sans);font-size:.78rem;font-weight:500;color:var(--text);white-space:nowrap;z-index:2;}
.zb-key{position:absolute;transform:translateX(-50%);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);font-weight:500;z-index:2;bottom:8px;}
.zc-f{display:flex;justify-content:space-between;align-items:baseline;margin-top:.85rem;padding-top:.5rem;border-top:0.5px solid var(--border);font-size:.72rem;color:var(--text-muted);}
.zc-tot{font-size:.82rem;color:var(--text);}
.zc-tot strong{font-weight:500;font-size:1rem;}
.zc-empty{grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:.85rem;padding:2rem;}
/* ── Sportart-Rose (Polar-Bar: Winkel=Zeit · Radius=Load) ─────────────────── */
.sport-rose{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.1rem 1.25rem;margin:1rem 0;}
.sr-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.85rem;padding-bottom:.5rem;border-bottom:0.5px solid var(--border);}
.sr-h h2{font-weight:600;font-size:1.05rem;letter-spacing:-.01em;margin:0;color:var(--text);}
.sr-week{font-style:italic;font-size:.78rem;color:var(--text-muted);}
.sr-body{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;align-items:center;}
.sr-svg-wrap{aspect-ratio:1/1;max-width:280px;margin:0 auto;width:100%;position:relative;}
#sr-svg{width:100%;height:100%;display:block;}
.sr-legend{display:flex;flex-direction:column;gap:.55rem;}
.sr-leg-item{display:flex;align-items:center;gap:.55rem;font-size:.78rem;line-height:1.2;}
.sr-leg-swatch{width:11px;height:11px;border-radius:2px;flex-shrink:0;}
.sr-leg-name{font-weight:500;color:var(--text);flex-shrink:0;min-width:55px;}
.sr-leg-vals{color:var(--text-muted);font-size:.72rem;}
.sr-f{display:flex;justify-content:space-between;align-items:baseline;margin-top:.85rem;padding-top:.5rem;border-top:0.5px solid var(--border);font-size:.7rem;color:var(--text-muted);}
.sr-axes{font-style:italic;}
.sr-tot{font-size:.82rem;color:var(--text);}
.sr-tot strong{font-weight:500;font-size:1rem;}
@media(max-width:520px){
  .sr-body{grid-template-columns:1fr;gap:.8rem;}
  .sr-svg-wrap{max-width:240px;}
}
</style></head>
